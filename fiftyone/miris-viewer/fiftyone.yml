name: "@miris/viewer"
type: plugin
author: Miris Inc.
version: 1.0.0
description: >
  Miris spatial streaming viewer for FiftyOne 3D datasets.
  Streams USD assets progressively via Miris directly in the browser.
url: https://miris.com
license: Apache-2.0
fiftyone:
  version: ">=1.0"
js_bundle: js/dist/index.umd.js
operators:
  - upsert_miris_asset
  - sync_miris_assets
panels:
  - Miris Viewer
